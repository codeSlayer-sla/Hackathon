# Node A ("Enterprise") for a real 3-machine demo: the coordination hub
# (router, rag, frontend) plus installed-base and the two peers that MUST
# stay physically colocated with it -- peer-vision/peer-voice read the same
# photo/audio files installed-base writes via the shared `media-data`
# Docker volume, which is local to one host and does not sync across
# laptops. peer-medium and peer-gpu are pure text (the query travels whole
# in the request body, no file path involved), so they're the ones that
# move to Node B / Node C -- see docker-compose.node-b.yml / node-c.yml.
#
# Only 2 laptops available? Also run docker-compose.node-b.yml's
# peer-medium here (merge Node B into Node A) and keep Node C as-is.
#
# Usage: see docs/multi-host-demo.md.
name: enterprise-ai-mesh-node-a

services:
  rag:
    build:
      context: .
      dockerfile: services/rag/Dockerfile
    ports:
      - "8002:8000"
    volumes:
      - qvac-models-rag:/data/qvac-models
    networks: [mesh]

  router:
    build:
      context: .
      dockerfile: services/router/Dockerfile
    environment:
      NODE_ID: router
      RAG_URL: http://rag:8000
    ports:
      - "8001:8000"
    depends_on: [rag]
    networks: [mesh]

  peer-vision:
    build:
      context: .
      dockerfile: services/peer/Dockerfile
    environment:
      NODE_ID: peer-vision
      ROLE: medium_provider
      MODEL_TIER: medium
      MODEL_KIND: multimodal
      MODEL_NAME: VISIONPSY_NANO_460M_MULTIMODAL_Q8_0
      MODEL_PROJECTION_NAME: MMPROJ_VISIONPSY_NANO_460M_MULTIMODAL_Q8_0
      PRICE_PER_1K_TOKENS: "0"
      ROUTER_URL: http://router:8000
      PORT: "8000"
    ports:
      - "8006:8000"
    volumes:
      - qvac-models-vision:/data/qvac-models
      - media-data:/data/media
    depends_on: [router]
    networks: [mesh]

  peer-voice:
    build:
      context: .
      dockerfile: services/peer/Dockerfile
    environment:
      NODE_ID: peer-voice
      ROLE: medium_provider
      MODEL_TIER: medium
      MODEL_KIND: transcription
      MODEL_NAME: WHISPER_TINY
      PRICE_PER_1K_TOKENS: "0"
      ROUTER_URL: http://router:8000
      PORT: "8000"
    ports:
      - "8007:8000"
    volumes:
      - qvac-models-voice:/data/qvac-models
      - media-data:/data/media
    depends_on: [router]
    networks: [mesh]

  installed-base:
    build:
      context: .
      dockerfile: services/installed-base/Dockerfile
    environment:
      NODE_ID: installed-base
      ROUTER_URL: http://router:8000
      INSTALLED_BASE_DB_PATH: /data/installed_base.db
      INSTALLED_BASE_MEDIA_DIR: /data/media
      AUTH_PEPPER: hackathon-demo-pepper-change-me
    ports:
      - "8005:8000"
    volumes:
      - installed-base-data:/data
      - media-data:/data/media
    depends_on: [router]
    networks: [mesh]

  frontend:
    build:
      context: .
      dockerfile: services/frontend/Dockerfile
      args:
        # Change to this laptop's LAN IP (not localhost) if judges/teammates
        # will open the frontend from a different device on the network.
        VITE_ROUTER_URL: http://localhost:8001
        VITE_INSTALLED_BASE_URL: http://localhost:8005
    ports:
      - "5173:5173"
    depends_on: [router, installed-base]
    networks: [mesh]

networks:
  mesh:
    driver: bridge

volumes:
  qvac-models-rag:
  qvac-models-vision:
  qvac-models-voice:
  installed-base-data:
  media-data:
