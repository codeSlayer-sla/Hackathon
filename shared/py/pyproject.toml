[project]
name = "qvac-mesh-shared"
version = "0.1.0"
description = "Shared Pydantic contracts for the Enterprise AI Mesh services"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["qvac_mesh_shared"]
