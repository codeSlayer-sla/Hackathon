name: enterprise-ai-mesh

services:
  rag:
    build:
      context: .
      dockerfile: services/rag/Dockerfile
    ports:
      - "8002:8000"
    volumes:
      - qvac-models-rag:/data/qvac-models
    networks: [mesh]

  router:
    build:
      context: .
      dockerfile: services/router/Dockerfile
    environment:
      NODE_ID: router
      RAG_URL: http://rag:8000
    ports:
      - "8001:8000"
    depends_on: [rag]
    networks: [mesh]

  peer-medium:
    build:
      context: .
      dockerfile: services/peer/Dockerfile
    environment:
      NODE_ID: peer-medium
      ROLE: medium_provider
      MODEL_TIER: medium
      MODEL_NAME: MEDGEMMA_4B_IT_Q4_1
      PRICE_PER_1K_TOKENS: "0"
      ROUTER_URL: http://router:8000
      PORT: "8000"
    ports:
      - "8003:8000"
    volumes:
      - qvac-models-medium:/data/qvac-models
    depends_on: [router]
    networks: [mesh]

  peer-gpu:
    build:
      context: .
      dockerfile: services/peer/Dockerfile
    environment:
      NODE_ID: peer-gpu
      ROLE: large_provider
      MODEL_TIER: large
      # Same model as peer-medium on purpose, not a placeholder: both must
      # match, since the Router picks whichever "completion" peer registered
      # first (no tier preference in pick_by_capability) -- running two
      # peers with different models here would make which one actually
      # answers nondeterministic. Swap for a real large model + GPU config
      # once there's an actual GPU to put behind peer-gpu specifically.
      #
      # MedGemma over a general instruct model on purpose: the domain here
      # is medical equipment (MR/CT/Ultrasound/etc.), which is exactly
      # MedGemma's tuning target. Caveat -- it's tuned for clinical text
      # QA, not necessarily strict JSON-schema output the way an instruct
      # model is; if it doesn't reliably follow "respond with only this
      # JSON shape" (see services/installed-base/app/extraction.py), swap
      # back to QWEN3_4B_INST_Q4_K_M, a one-line change.
      MODEL_NAME: MEDGEMMA_4B_IT_Q4_1
      PRICE_PER_1K_TOKENS: "0.003"
      ROUTER_URL: http://router:8000
      PORT: "8000"
    ports:
      - "8004:8000"
    volumes:
      - qvac-models-gpu:/data/qvac-models
    depends_on: [router]
    networks: [mesh]

  peer-vision:
    build:
      context: .
      dockerfile: services/peer/Dockerfile
    environment:
      NODE_ID: peer-vision
      ROLE: medium_provider
      MODEL_TIER: medium
      MODEL_KIND: multimodal
      # VisionPsy Nano: ~460M params, small enough to be viable without a
      # dedicated GPU. Swap for a bigger VLM (Qwen3-VL, SmolVLM2) if photo
      # ID accuracy needs it once this is run against real photos.
      MODEL_NAME: VISIONPSY_NANO_460M_MULTIMODAL_Q8_0
      MODEL_PROJECTION_NAME: MMPROJ_VISIONPSY_NANO_460M_MULTIMODAL_Q8_0
      PRICE_PER_1K_TOKENS: "0"
      ROUTER_URL: http://router:8000
      PORT: "8000"
    ports:
      - "8006:8000"
    volumes:
      - qvac-models-vision:/data/qvac-models
      - media-data:/data/media
    depends_on: [router]
    networks: [mesh]

  peer-voice:
    build:
      context: .
      dockerfile: services/peer/Dockerfile
    environment:
      NODE_ID: peer-voice
      ROLE: medium_provider
      MODEL_TIER: medium
      MODEL_KIND: transcription
      MODEL_NAME: WHISPER_TINY
      PRICE_PER_1K_TOKENS: "0"
      ROUTER_URL: http://router:8000
      PORT: "8000"
    ports:
      - "8007:8000"
    volumes:
      - qvac-models-voice:/data/qvac-models
      - media-data:/data/media
    depends_on: [router]
    networks: [mesh]

  installed-base:
    build:
      context: .
      dockerfile: services/installed-base/Dockerfile
    environment:
      NODE_ID: installed-base
      ROUTER_URL: http://router:8000
      INSTALLED_BASE_DB_PATH: /data/installed_base.db
      INSTALLED_BASE_MEDIA_DIR: /data/media
      # Demo-only pepper for PIN hashing -- change this (and rotate demo
      # PINs) before ever using this outside a hackathon sandbox.
      AUTH_PEPPER: hackathon-demo-pepper-change-me
    ports:
      - "8005:8000"
    volumes:
      - installed-base-data:/data
      - media-data:/data/media
    depends_on: [router, peer-vision, peer-voice]
    networks: [mesh]

  frontend:
    build:
      context: .
      dockerfile: services/frontend/Dockerfile
      args:
        VITE_ROUTER_URL: http://localhost:8001
        VITE_INSTALLED_BASE_URL: http://localhost:8005
    ports:
      - "5173:5173"
    depends_on: [router, installed-base]
    networks: [mesh]

networks:
  mesh:
    driver: bridge

volumes:
  qvac-models-rag:
  qvac-models-medium:
  qvac-models-gpu:
  qvac-models-vision:
  qvac-models-voice:
  installed-base-data:
  media-data:
